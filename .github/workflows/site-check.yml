name: Website usability checks
on:
  push:
    branches: [main, codex/seo-usability-20261115]
    paths: ['**.html', 'assets/**', 'scripts/check-site.mjs', '.github/workflows/site-check.yml']
  pull_request:
    paths: ['**.html', 'assets/**', 'scripts/check-site.mjs', '.github/workflows/site-check.yml']
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check shopping flow and responsive layout
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/site-http.log 2>&1 &
          node scripts/check-site.mjs
      - name: Preserve verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshots
          path: site-screenshots/
          if-no-files-found: ignore
